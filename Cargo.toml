[package]
name = "custom-skate"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Custom ice and roller hockey skates from a foot scan, with a light rocking aluminium chassis, modelled with CortenForge"
publish = false

[dependencies]
cortenforge = "0.9.0"
# The explicit (impact) solver, track D3: published with CortenForge 0.9 but not re-exported by
# the facade (docs/CORTENFORGE.md).
cortenforge-sim-soft-explicit = "0.9.0"
nalgebra = "0.34"
# Display only: PNG views of scans and parts (src/render.rs, examples).
png = "0.18"

[profile.release]
debug = false
